# Dependencies allowed to run install/build scripts. pnpm 11 hard-fails
# (ERR_PNPM_IGNORED_BUILDS) on any dependency with an unanswered build script,
# so every native dep in the tree must be answered here. `allowBuilds` is the
# map pnpm 11 reads; the `onlyBuiltDependencies` list keeps older pnpm majors
# working too. Verified with a fresh `pnpm install --frozen-lockfile`.
allowBuilds:
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
